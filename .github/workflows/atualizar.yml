# Atualiza os dados todos os dias (6h de Brasília) e publica: cada commit na main faz a Vercel publicar sozinha.
# Também dá para rodar à mão: aba Actions > "Atualizar dados" > Run workflow.
name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # arquivos grandes do TSE: os de eleições encerradas não mudam mais. O nome do cache muda quando uma eleição
      # fecha (1º de fevereiro do ano seguinte), para os arquivos dela entrarem no cache novo.
      - name: Nome do cache do TSE
        id: tse
        run: echo "chave=$(python -c 'import sys; sys.path.insert(0, "scripts"); import tse; print(tse.chave_cache())')" >> "$GITHUB_OUTPUT"

      # os caches são lidos aqui e salvos no fim, mesmo se alguma etapa falhar ou o tempo acabar ("if: always()"):
      # assim o que já foi baixado não se perde
      - uses: actions/cache/restore@v4
        with:
          path: .cache/tse
          key: ${{ steps.tse.outputs.chave }}
          restore-keys: tse-

      # consultas do Senado e do Executivo (sem isso, cada rodada leva ~30 min)
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/senado
            .cache/executivo
          key: senado-${{ github.run_id }}
          restore-keys: senado-

      # Câmara: histórico das leis (não muda), gastos e consultas por deputado (~70 MB).
      # Os arquivos anuais grandes (~1,5 GB) baixam em ~2 min e não entram no cache.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/camara/tramitacoes
            .cache/camara/cota
            .cache/camara/api
          key: camara-${{ github.run_id }}
          restore-keys: camara-

      # o resto: IBGE, votações e Assembleias Legislativas (cada Casa na sua pasta)
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            !.cache/tse
            !.cache/senado
            !.cache/executivo
            !.cache/camara
            !.cache/camaras
          key: outros-${{ github.run_id }}
          restore-keys: outros-

      # Câmaras Municipais: o estado de cada Câmara (o que já foi lido). O mesmo cache do robô das cidades (Câmaras com
      # SAPL); os dois robôs nunca rodam ao mesmo tempo, então o último cache salvo tem o estado de todas
      - uses: actions/cache/restore@v4
        with:
          path: .cache/camaras
          key: camaras-${{ github.run_id }}
          restore-keys: camaras-

      - name: Câmara dos Deputados
        run: python scripts/camara.py
        continue-on-error: true

      - name: Senado Federal
        run: python scripts/senado.py
        continue-on-error: true

      - name: Presidente e vice
        run: python scripts/executivo.py
        continue-on-error: true

      # ministros do STF (scripts/stf.py): lê os sites do STF e os Dados Abertos do Senado uma vez por semana (nos outros
      # dias sai sem pedir nada); se um site estiver fora do ar, fica o dados/stf.json de antes. Avisa no resumo quando a
      # composição muda. O cache (.cache/stf) já entra no cache "outros"; as fotos vão para img/pessoas/stf-*.jpg.
      - name: Ministros do STF
        run: python scripts/stf.py
        continue-on-error: true
        timeout-minutes: 15

      - name: TSE e IBGE
        run: python scripts/tse.py
        continue-on-error: true

      # quem foi eleito em 2026 e ainda não tomou posse (dados/eleitos/): usa as candidaturas que o tse.py acabou de baixar,
      # a votação por município e zona (baixada de novo a cada 7 dias; guarda só as somas em .cache/eleitos) e o
      # DivulgaCandContas (eleições suplementares). Se o TSE não responder, ficam os arquivos de antes. Cada cargo sai dos
      # arquivos no dia da posse.
      - name: Eleitos em 2026 (até a posse)
        run: python scripts/eleitos.py
        continue-on-error: true
        timeout-minutes: 20

      # cada Casa tem o seu coletor (scripts/assembleias/<uf>.py) e o seu servidor: rodam todas ao mesmo tempo, cada uma
      # respeitando o robots.txt e o intervalo pedido (60 s nos SAPL do Interlegis). Com o cache cheio: 6 a 13 min. Sem
      # cache (a primeira vez), cada Casa usa a rodada toda, guarda o que leu em .cache/ e só grava quando termina: as
      # mais lentas (MG, PB) levam uns 7 dias; até lá ficam os dados publicados antes. As Câmaras das capitais seguem
      # num passo próprio (se o site de uma Casa estiver fora do ar, fica a lista da última rodada que deu certo).
      - name: Assembleias Legislativas
        run: python scripts/legislativos.py assembleias --paralelo 27 --minutos 50
        continue-on-error: true
        timeout-minutes: 60

      # cada capital tem o seu coletor e o seu servidor: rodam todas ao mesmo tempo (uma vaga por capital, um pedido por vez
      # em cada site). As capitais com SAPL respeitam os 60 s entre pedidos que o robots.txt pede, e as lidas em páginas do
      # site têm primeiras cargas longas (Belo Horizonte, Belém, Salvador, Recife): essas usam a rodada toda, e com menos
      # vagas as últimas da lista (São Paulo, Rio, Goiânia...) não começariam antes do fim da rodada. 60 minutos: o orçamento
      # de cada Câmara com SAPL é de 60 pedidos por rodada (60 s entre eles); com 35 minutos, a primeira leitura de uma
      # capital grande no robô (Boa Vista, Manaus: ~1.900 propostas) levaria semanas. Sem o cache, a primeira leitura leva
      # de 1 dia a algumas semanas (até lá fica o que estava publicado); com o cache, 5 a 25 min.
      - name: Câmaras Municipais das capitais
        run: python scripts/legislativos.py camaras --paralelo 26 --minutos 60
        continue-on-error: true
        timeout-minutes: 65

      # a IA responde devagar: no máximo 60 min por dia (o que faltar fica para o dia seguinte)
      - name: Explicações simples (português e inglês)
        run: python scripts/simplificar.py
        continue-on-error: true
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMITE: "140"
          MINUTOS: "60"

      - name: Juntar tudo
        run: python scripts/montar.py

      - name: Salvar no repositório
        run: |
          git config user.name "lucastaonline"
          git config user.email "31556507+lucastaonline@users.noreply.github.com"
          git add -A dados img/pessoas 'sitemap*.xml'
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            # alguém pode ter publicado outra mudança enquanto esta rodada corria (ela leva de minutos a horas):
            # junta com o que está no GitHub antes de enviar; num conflito em dados/, valem os dados desta rodada
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 20
            done
            exit 1
          fi

      - name: Guardar o cache do TSE
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tse
          key: ${{ steps.tse.outputs.chave }}

      - name: Guardar o cache do Senado e do Executivo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/senado
            .cache/executivo
          key: senado-${{ github.run_id }}

      - name: Guardar o cache da Câmara
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/camara/tramitacoes
            .cache/camara/cota
            .cache/camara/api
          key: camara-${{ github.run_id }}

      - name: Guardar o resto do cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            !.cache/tse
            !.cache/senado
            !.cache/executivo
            !.cache/camara
            !.cache/camaras
          key: outros-${{ github.run_id }}

      - name: Guardar o cache das Câmaras Municipais
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/camaras
          key: camaras-${{ github.run_id }}
