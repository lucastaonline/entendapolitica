# Atualiza os dados todos os dias (6h de Brasília) e publica: cada commit na main faz a Vercel publicar sozinha.
# Também dá para rodar à mão: aba Actions > "Atualizar dados" > Run workflow.
name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # arquivos grandes do TSE: os de eleições encerradas não mudam mais. O nome do cache muda quando uma eleição
      # fecha (1º de fevereiro do ano seguinte), para os arquivos dela entrarem no cache novo.
      - name: Nome do cache do TSE
        id: tse
        run: echo "chave=$(python -c 'import sys; sys.path.insert(0, "scripts"); import tse; print(tse.chave_cache())')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache/tse
          key: ${{ steps.tse.outputs.chave }}
          restore-keys: tse-

      # consultas do Senado e do Executivo (sem isso, cada rodada leva ~30 min)
      - uses: actions/cache@v4
        with:
          path: |
            .cache/senado
            .cache/executivo
          key: senado-${{ github.run_id }}
          restore-keys: senado-

      # Câmara: histórico das leis (não muda), gastos e consultas por deputado (~70 MB).
      # Os arquivos anuais grandes (~1,5 GB) baixam em ~2 min e não entram no cache.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/camara/tramitacoes
            .cache/camara/cota
            .cache/camara/api
          key: camara-${{ github.run_id }}
          restore-keys: camara-

      # o resto: IBGE, votações, Assembleias Legislativas e Câmaras Municipais (cada Casa na sua pasta)
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/tse
            !.cache/senado
            !.cache/executivo
            !.cache/camara
          key: outros-${{ github.run_id }}
          restore-keys: outros-

      - name: Câmara dos Deputados
        run: python scripts/camara.py
        continue-on-error: true

      - name: Senado Federal
        run: python scripts/senado.py
        continue-on-error: true

      - name: Presidente e vice
        run: python scripts/executivo.py
        continue-on-error: true

      - name: TSE e IBGE
        run: python scripts/tse.py
        continue-on-error: true

      # cada Casa tem o seu coletor (scripts/assembleias/<uf>.py, scripts/camaras/c<IBGE>.py); se o site de uma
      # Casa estiver fora do ar, fica a lista da última rodada que deu certo. Com o cache cheio: ~25 min (Assembleias)
      # e ~10 min (Câmaras). A primeira rodada sem cache é bem mais longa: os coletores param no limite de tempo de
      # cada dia e completam aos poucos (o que já foi lido fica no cache).
      - name: Assembleias Legislativas
        run: python scripts/legislativos.py assembleias
        continue-on-error: true
        timeout-minutes: 60

      - name: Câmaras Municipais das capitais
        run: python scripts/legislativos.py camaras
        continue-on-error: true
        timeout-minutes: 40

      - name: Explicações simples (português e inglês)
        run: python scripts/simplificar.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMITE: "140"

      - name: Juntar tudo
        run: python scripts/montar.py

      - name: Salvar no repositório
        run: |
          git config user.name "lucastaonline"
          git config user.email "31556507+lucastaonline@users.noreply.github.com"
          git add dados img/pessoas sitemap.xml
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            git push
          fi
