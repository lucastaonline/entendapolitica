# Atualiza o que é de cada cidade, num robô separado do diário: o mapa das Câmaras Municipais e prefeituras (sites
# oficiais, sistema de propostas da Câmara, Diário Oficial e pedido de informação) e as leis e os vetos de cada prefeitura
# (Diários Oficiais e páginas oficiais de leis dos municípios), um grupo de estados por dia: cada estado é conferido uma
# vez por semana. Cada commit na main faz a Vercel publicar sozinha.
# Também dá para rodar à mão: aba Actions > "Atualizar cidades" > Run workflow.
name: Atualizar cidades

on:
  schedule:
    # meia-noite de Brasília, antes do robô diário (6h): enquanto as primeiras cargas das Câmaras com SAPL não terminam,
    # este robô pode levar umas 5 horas
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# o mesmo grupo do robô diário: um de cada vez (os dois fazem commit na main)
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  cidades:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # o que foi visto em cada cidade (uma cidade só é conferida de novo depois de 6 dias; se um site não abrir numa
      # rodada, vale o que foi conferido até 45 dias antes) e o que já foi lido dos Diários Oficiais (diarios/atos: os
      # meses lidos não são lidos de novo; a primeira carga continua de uma rodada para a outra). Lido aqui e guardado no
      # fim, mesmo se algo falhar.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/municipios
          key: municipios-${{ github.run_id }}
          restore-keys: municipios-

      # candidatos do TSE de 2024 (o coletor das Câmaras liga cada vereador ao TSE): só lê o cache que o robô diário guarda
      - uses: actions/cache/restore@v4
        with:
          path: .cache/tse
          key: tse-cidades-${{ github.run_id }}
          restore-keys: tse-

      # o estado de cada Câmara Municipal (o que já foi lido; ~0,4 MB por cidade). O mesmo cache do passo das capitais no
      # robô diário; os dois robôs nunca rodam ao mesmo tempo
      - uses: actions/cache/restore@v4
        with:
          path: .cache/camaras
          key: camaras-${{ github.run_id }}
          restore-keys: camaras-

      - name: Mapa das Câmaras e prefeituras (o grupo de estados do dia)
        run: python scripts/municipios/mapear.py --rodizio
        continue-on-error: true
        timeout-minutes: 60

      # leis e vetos de cada prefeitura, só onde a contagem é segura (o mesmo grupo de estados do dia); o que não der
      # tempo fica para a próxima rodada, e nada é publicado pela metade
      - name: Leis e vetos das prefeituras (Diários Oficiais e páginas oficiais de leis)
        run: python scripts/municipios/diarios.py --rodizio --minutos 40
        continue-on-error: true
        timeout-minutes: 50

      # Câmaras Municipais com SAPL (scripts/camaras/sapl_cidades.json): as cidades do dia (cada uma uma vez por semana) e,
      # depois, as que ainda não terminaram a primeira carga. O robots.txt do SAPL pede 60 s entre pedidos: cada cidade faz
      # no máximo 60 pedidos por dia; o que não terminar continua no dia seguinte, e enquanto isso fica publicado o que já
      # estava. 40 cidades ao mesmo tempo (quase todas no mesmo servidor do Interlegis: ~40 pedidos por minuto, no total)
      - name: Câmaras Municipais com SAPL
        run: python scripts/legislativos.py sapl --parte hoje --pendentes --paralelo 40 --minutos 150
        continue-on-error: true
        timeout-minutes: 165

      - name: Juntar tudo
        run: python scripts/montar.py

      - name: Salvar no repositório
        run: |
          git config user.name "lucastaonline"
          git config user.email "31556507+lucastaonline@users.noreply.github.com"
          git add -A dados img/pessoas 'sitemap*.xml'
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Cidades atualizadas em $(date -u +%Y-%m-%d)"
            # o robô diário pode ter publicado enquanto esta rodada corria: junta com o que está no GitHub antes de
            # enviar; num conflito em dados/, valem os dados desta rodada
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 20
            done
            exit 1
          fi

      - name: Guardar o cache do mapa
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/municipios
          key: municipios-${{ github.run_id }}

      - name: Guardar o cache das Câmaras Municipais
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/camaras
          key: camaras-${{ github.run_id }}
